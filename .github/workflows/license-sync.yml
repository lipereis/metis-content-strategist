# .github/workflows/license-sync.yml
# Sync Stripe purchases to GitHub Gist license database
# Triggered by Stripe webhook via GitHub Actions repository_dispatch

name: Sync License from Stripe

on:
  repository_dispatch:
    types: [stripe_purchase]
  workflow_dispatch:  # Allow manual run from Actions tab

permissions:
  contents: write  # needed to update Gist

jobs:
  sync-license:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests pyyaml
      
      - name: Parse payload
        id: payload
        run: |
          echo "client_email=${{ github.event.client_payload.email }}" >> $GITHUB_OUTPUT
          echo "plan=${{ github.event.client_payload.plan }}" >> $GITHUB_OUTPUT
          echo "license_key=${{ github.event.client_payload.license_key }}" >> $GITHUB_OUTPUT
          echo "expires=${{ github.event.client_payload.expires }}" >> $GITHUB_OUTPUT
          echo "max_runs=${{ github.event.client_payload.max_runs }}" >> $GITHUB_OUTPUT
      
      - name: Fetch current Gist
        id: gist
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.LICENSE_GIST_ID }}
        run: |
          curl -s -H "Authorization: token $GIST_PAT" \
            "https://api.github.com/gists/${GIST_ID}" > gist.json
          
          # Extract current content
          CURRENT_CONTENT=$(cat gist.json | jq -r '.files["licenses.json"].content')
          echo "current_content<<EOF" >> $GITHUB_OUTPUT
          echo "$CURRENT_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Update license database
        id: update
        run: |
          python3 << 'EOF'
          import json, sys
          
          # Parse current
          current = json.loads('''${{ steps.gist.outputs.current_content }}''')
          
          # New license
          new_key = "${{ steps.payload.outputs.license_key }}"
          new_lic = {
              "email": "${{ steps.payload.outputs.client_email }}",
              "plan": "${{ steps.payload.outputs.plan }}",
              "expires": "${{ steps.payload.outputs.expires }}",
              "max_runs": ${{ steps.payload.outputs.max_runs }}
          }
          
          # Update
          current["licenses"][new_key] = new_lic
          
          # Output updated JSON
          print(json.dumps(current, indent=2))
          EOF
      
      - name: Update Gist
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.LICENSE_GIST_ID }}
        run: |
          UPDATED_CONTENT="${{ steps.update.outputs.stdout }}"
          
          curl -X PATCH \
            -H "Authorization: token $GIST_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/gists/${GIST_ID}" \
            -d "{\"files\": {\"licenses.json\": {\"content\": $(echo \"$UPDATED_CONTENT\" | jq -Rs .)}}}"
      
      - name: Notify success
        run: |
          echo "✅ License added to Gist: ${{ steps.payload.outputs.license_key }}"
          echo "Customer: ${{ steps.payload.outputs.client_email }}"
          echo "Plan: ${{ steps.payload.outputs.plan }}"