name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate tone template
        run: python scripts/validate_tone.py templates/tone_of_voice.yaml

      # The LLM is faked in the unit tests, so no API key is needed here.
      - name: Unit tests
        run: pytest tests -q

      - name: Module 1 offline run
        run: |
          python scripts/module1_pipeline.py --input sample_transcript.txt \
            --tone-config templates/tone_of_voice.yaml --output-dir test_output --offline
          grep -q "CLEANED TRANSCRIPT SEGMENTS" test_output/*.md
